name: MDV Jefe Maestro Pipeline

on:
  schedule:
    - cron: '0 17 * * 1'   # Lunes    11:00 AM México Centro
    - cron: '0 17 * * 4'   # Jueves   11:00 AM México Centro
    - cron: '0 17 * * 6'   # Sábado   11:00 AM México Centro
  workflow_dispatch:        # Permite correrlo manualmente

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar históricos (scraping)
        run: python core/system/csv_updater.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}

      - name: Correr Jefe Maestro
        run: python core/system/main_run.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}

      - name: Migracion retroactiva (SOLO UNA VEZ - borrar despues)
        run: python core/system/retroactive_migration.py --depth 150
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name  "Jefe Maestro Bot"
          git config user.email "actions@github.com"
          git add results/ || true
          git add predictions_history_v8.json || true
          git add backtest_history_v8.json    || true
          git add data/melate.csv data/revancha.csv data/revanchita.csv || true
          git add rocket_phoenix_tracking.json || true
          git add retroactive_tracking.json || true
          git add reinforced_*.json || true
                    git diff --staged --quiet || git commit -m "🎰 Resultados $(date '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push


