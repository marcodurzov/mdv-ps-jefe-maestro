name: MDV Automation

on:
  schedule:
    # Actualizar resultados
    - cron: '0 17 * * 1,4,6'
    
    # Ejecutar modelo
    - cron: '30 17 * * 1,4,6'

  workflow_dispatch:

jobs:

  update-results:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update lottery results
        run: python core/system/csv_updater.py


  run-model:

    runs-on: ubuntu-latest
    needs: update-results

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction system
        run: python core/system/main_run.py
