name: MDV PS Automation

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 17 * * 1,4,6'
    - cron: '0 23 * * 1,4,6'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python main_update.py
      - run: python main_run.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
