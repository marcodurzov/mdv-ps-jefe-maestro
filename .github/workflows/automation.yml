name: MDV PS Automation

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 17 * * 1,4,6'
    - cron: '0 23 * * 1,4,6'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Display Python path
        run: |
          which python
          python --version

      - name: Install dependencies (FORCED SAME PYTHON)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn scipy matplotlib requests openpyxl
          python -m pip install gspread google-auth google-auth-oauthlib google-auth-httplib2
          python -m pip install psutil

      - name: Verify installations
        run: |
          python -c "import pandas"
          python -c "import matplotlib"
          python -c "import psutil"
          python -c "import gspread"

      - name: Run Update
        working-directory: core
        run: python main_update.py

      - name: Run Model
        working-directory: core
        run: python main_run.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
