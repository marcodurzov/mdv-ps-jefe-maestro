name: MDV Automation

on:
  schedule:
    - cron: '0 17 * * 1,4,6'
    - cron: '30 17 * * 1,4,6'
  workflow_dispatch:

jobs:

  update-results:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run updater
        working-directory: core/system
        run: python csv_updater.py


  run-model:
    runs-on: ubuntu-latest
    needs: update-results

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run model
        working-directory: core/system
        run: python main_run.py
